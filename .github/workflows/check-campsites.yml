name: Check Yosemite Campsites

on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 min, UTC time — GH may delay this slightly during peak load
  workflow_dispatch: {}       # lets you trigger it manually from the Actions tab to test

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt requests
      - name: Check availability and notify
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python camping.py --start-date 2026-07-18 --end-date 2026-07-19 --parks 232447 232449 232450 | python notify_ntfy.py
          python camping.py --start-date 2026-07-19 --end-date 2026-07-20 --parks 232447 232449 232450 | python notify_ntfy.py
          python camping.py --start-date 2026-07-20 --end-date 2026-07-21 --parks 232447 232449 232450 | python notify_ntfy.py
          python camping.py --start-date 2026-07-21 --end-date 2026-07-22 --parks 232447 232449 232450 | python notify_ntfy.py
